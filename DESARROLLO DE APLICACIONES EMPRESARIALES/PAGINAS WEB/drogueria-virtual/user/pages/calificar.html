<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calificar y comentar - VitalFarma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/header.css">
  <link rel="stylesheet" href="../../css/responsive.css">
  <!-- carrito.css trae los estilos de tabs, estrellas y chips -->
  <link rel="stylesheet" href="../../css/carrito.css">
  <link rel="stylesheet" href="../css/user.css">
</head>

<body>

  <!-- HEADER -->
  <header class="header">
    <div class="contenedor header__contenido">
      <a href="../../index.html" class="header__logo">
        <span class="header__logo-marca"><i class="bi bi-plus-lg"></i></span>
        <span class="header__logo-texto">Vital<span>Farma</span></span>
      </a>

      <div class="header__buscador">
        <i class="bi bi-search header__buscador-icono"></i>
        <input type="text" data-i18n="buscar_placeholder" placeholder="Buscar productos, marcas, categorías...">
      </div>

      <div class="header__acciones">
        <!-- Sin data-i18n: main.js reemplaza el contenido con la inicial del usuario -->
        <a href="../../login.html" class="header__icono" id="headerCuenta" data-i18n-title="mi_cuenta"
          title="Mi cuenta"><i class="bi bi-person"></i></a>
        <!-- Sin data-i18n: contiene el contador del carrito -->
        <a href="../../pages/carrito.html" class="header__icono" data-i18n-title="carrito" title="Carrito">
          <i class="bi bi-bag"></i>
          <span class="header__carrito-contador">0</span>
        </a>
        <button class="header__menu-toggle" id="menuToggle"><i class="bi bi-list"></i></button>
      </div>
    </div>
    <nav class="nav">
      <div class="contenedor">
        <ul class="nav__lista" id="navLista">
          <li><a href="../../pages/catalogo.html" class="nav__link" data-i18n="catalogo">Catálogo</a></li>
          <li><a href="../../pages/orden-medica.html" class="nav__link nav__link--destacado"
              data-i18n="subir_orden">Subir orden médica</a></li>
        </ul>
      </div>
    </nav>
  </header>

  <!-- CONTENIDO -->
  <section class="contenedor user-layout">

    <!-- SIDEBAR -->
    <aside class="user-sidebar">
      <div class="user-sidebar__perfil">
        <!-- Sin data-i18n: user.js escribe la inicial, el nombre y el correo -->
        <div class="user-sidebar__avatar" id="sidebarAvatar">U</div>
        <div>
          <div class="user-sidebar__nombre" id="sidebarNombre">Cargando...</div>
          <div class="user-sidebar__email" id="sidebarEmail"></div>
        </div>
      </div>
      <nav class="user-sidebar__nav">
        <!-- El icono va aparte del <span>: data-i18n sobre el <a> lo borraría -->
        <a href="../index.html" class="user-sidebar__link">
          <i class="bi bi-house-door"></i><span data-i18n="resumen">Resumen</span>
        </a>
        <a href="perfil.html" class="user-sidebar__link">
          <i class="bi bi-person"></i><span data-i18n="mi_perfil">Mi perfil</span>
        </a>
        <a href="direcciones.html" class="user-sidebar__link">
          <i class="bi bi-geo-alt"></i><span data-i18n="mis_direcciones">Mis direcciones</span>
        </a>
        <a href="pedidos.html" class="user-sidebar__link">
          <i class="bi bi-box-seam"></i><span data-i18n="mis_pedidos">Mis pedidos</span>
        </a>
        <a href="historial.html" class="user-sidebar__link">
          <i class="bi bi-clock-history"></i><span data-i18n="historial">Historial</span>
        </a>
        <a href="ordenes-medicas.html" class="user-sidebar__link">
          <i class="bi bi-clipboard2-pulse"></i><span data-i18n="ordenes_medicas">Órdenes médicas</span>
        </a>
        <a href="calificar.html" class="user-sidebar__link">
          <i class="bi bi-star"></i><span data-i18n="calificar_atencion">Calificar atención</span>
        </a>
      </nav>
      <button class="user-sidebar__logout" id="btnCerrarSesion">
        <i class="bi bi-box-arrow-right"></i><span data-i18n="cerrar_sesion">Cerrar sesión</span>
      </button>
    </aside>

    <!-- CALIFICAR -->
    <div class="user-panel" id="calificarContenido">
      <h1 class="user-panel__titulo" data-i18n="cal_titulo">Calificar y comentar</h1>
      <p class="user-panel__subtitulo" data-i18n="cal_subtitulo">Tu opinión nos ayuda a mejorar.</p>

      <div class="tab-switcher">
        <button class="tab-switcher__btn tab-switcher__btn--activo" data-tab="tabCalificar">
          <i class="bi bi-star"></i> <span data-i18n="cal_tab_calificar_texto">Calificar un pedido</span>
        </button>
        <button class="tab-switcher__btn" data-tab="tabComentar">
          <i class="bi bi-chat-square-text"></i> <span data-i18n="cal_tab_comentar_texto">Comentario / sugerencia</span>
        </button>
      </div>

      <!-- TAB: CALIFICAR PEDIDO -->
      <div class="tab-panel" id="tabCalificar">
        <form class="user-form" id="formCalificacion">
          <div>
            <label for="calificarPedido" data-i18n="cal_que_pedido">¿Qué pedido quieres calificar?</label>
            <!-- Sin data-i18n en la opción: calificar.js la reemplaza con los pedidos reales -->
            <select id="calificarPedido">
              <option value="">Cargando pedidos...</option>
            </select>
          </div>

          <div>
            <label data-i18n="cal_estrellas">¿Cómo calificarías la atención? (1 a 5 estrellas)</label>
            <div class="estrellas-selector" id="estrellasSelector">
              <button type="button" class="estrella-btn" data-valor="1">★</button>
              <button type="button" class="estrella-btn" data-valor="2">★</button>
              <button type="button" class="estrella-btn" data-valor="3">★</button>
              <button type="button" class="estrella-btn" data-valor="4">★</button>
              <button type="button" class="estrella-btn" data-valor="5">★</button>
            </div>
          </div>

          <div>
            <label data-i18n="cal_clasificacion">Clasificación general</label>
            <!-- El data-valor NO se traduce: es lo que se guarda en la base de datos -->
            <div class="clasificacion-selector">
              <button type="button" class="clasificacion-chip" data-valor="Excelente"
                data-i18n="cal_excelente">Excelente</button>
              <button type="button" class="clasificacion-chip" data-valor="Buena" data-i18n="cal_buena">Buena</button>
              <button type="button" class="clasificacion-chip" data-valor="Regular"
                data-i18n="cal_regular">Regular</button>
              <button type="button" class="clasificacion-chip" data-valor="Mala" data-i18n="cal_mala">Mala</button>
            </div>
          </div>

          <div>
            <label for="calificacionComentario" data-i18n="cal_comentario_opcional">Comentario (opcional)</label>
            <textarea id="calificacionComentario" rows="3" data-i18n="ph_cal_experiencia"
              placeholder="Cuéntanos más sobre tu experiencia..."></textarea>
          </div>

          <!-- Sin data-i18n: los mensajes los escribe calificar.js -->
          <div class="user-form__mensaje" id="calificacionMensaje"></div>
          <button type="submit" class="btn btn-primario" style="align-self:flex-start;" data-i18n="cal_enviar">Enviar
            calificación</button>
        </form>
      </div>

      <!-- TAB: COMENTARIO GENERAL -->
      <div class="tab-panel" id="tabComentar" style="display:none;">
        <form class="user-form" id="formComentario">
          <div>
            <label data-i18n="cal_tipo_mensaje">Tipo de mensaje</label>
            <div class="tipo-comentario-selector">
              <button type="button" class="tipo-chip" data-valor="comentario">
                <i class="bi bi-chat-dots"></i> <span data-i18n="cal_tipo_comentario_texto">Comentario</span>
              </button>
              <button type="button" class="tipo-chip" data-valor="queja">
                <i class="bi bi-exclamation-triangle"></i> <span data-i18n="cal_tipo_queja_texto">Queja</span>
              </button>
              <button type="button" class="tipo-chip" data-valor="sugerencia">
                <i class="bi bi-lightbulb"></i> <span data-i18n="cal_tipo_sugerencia_texto">Sugerencia</span>
              </button>
              <button type="button" class="tipo-chip" data-valor="recomendacion">
                <i class="bi bi-hand-thumbs-up"></i> <span data-i18n="cal_tipo_recomendacion_texto">Recomendación</span>
              </button>
            </div>
          </div>

          <div>
            <label for="comentarioTexto" data-i18n="cal_tu_mensaje">Tu mensaje</label>
            <textarea id="comentarioTexto" rows="4" data-i18n="ph_cal_escribe" placeholder="Escribe aquí..."></textarea>
          </div>

          <div class="user-form__mensaje" id="comentarioMensaje"></div>
          <button type="submit" class="btn btn-primario" style="align-self:flex-start;"
            data-i18n="cal_enviar_mensaje">Enviar mensaje</button>
        </form>
      </div>

    </div>
  </section>

  <script src="../../js/api.js"></script>
  <script src="../../js/idioma.js"></script>
  <script src="../../js/carrito.js"></script>
  <script src="../../js/main.js"></script>
  <script src="../js/user.js"></script>
  <script src="../js/calificar.js"></script>
</body>

</html>
