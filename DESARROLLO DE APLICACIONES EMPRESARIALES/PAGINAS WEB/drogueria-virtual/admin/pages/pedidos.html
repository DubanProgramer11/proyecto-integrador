<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos - Panel Administrativo VitalFarma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-layout">
    

    <div>
      <header class="admin-topbar">
        <h1 class="admin-topbar__titulo">Gestión de pedidos</h1>
        <div class="admin-topbar__usuario">
          <div><div id="adminNombre" style="font-weight:600;">Cargando...</div><span class="admin-topbar__rol" id="adminRol"></span></div>
          <div class="admin-topbar__avatar" id="adminAvatar">A</div>
        </div>
      </header>

      <main class="admin-contenido">

        <!-- Tarjetas de resumen por estado -->
        <div class="admin-stats-grid" id="pedidosResumen"></div>

        <!-- Filtros -->
        <div class="admin-panel">
          <div class="admin-toolbar">
            <div class="admin-toolbar__buscador">
              🔍 <input type="text" id="filtroBusqueda" placeholder="Buscar por cliente, correo o número de pedido...">
            </div>
            <select id="filtroEstado" style="padding:10px 14px; border:1.5px solid var(--color-borde); border-radius:var(--radio-md); font-size:0.87rem;">
              <option value="">Todos los estados</option>
              <option value="pendiente">Pendiente</option>
              <option value="confirmado">Confirmado</option>
              <option value="en_camino">En camino</option>
              <option value="entregado">Entregado</option>
              <option value="cancelado">Cancelado</option>
            </select>
            <input type="date" id="filtroDesde" title="Desde" style="padding:10px; border:1.5px solid var(--color-borde); border-radius:var(--radio-md); font-size:0.85rem;">
            <input type="date" id="filtroHasta" title="Hasta" style="padding:10px; border:1.5px solid var(--color-borde); border-radius:var(--radio-md); font-size:0.85rem;">
            <button class="btn btn-secundario" id="btnLimpiarFiltros" style="padding:10px 18px;">Limpiar</button>
          </div>

          <div class="admin-tabla-wrapper">
            <table class="admin-tabla">
              <thead>
                <tr>
                  <th>N.º</th>
                  <th>Cliente</th>
                  <th>Ítems</th>
                  <th>Total</th>
                  <th>Fecha</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="pedidosTabla">
                <tr><td colspan="7" style="text-align:center; padding:var(--espacio-lg);">Cargando pedidos...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Modal de detalle -->
  <div class="admin-modal-fondo" id="modalDetalleFondo">
    <div class="admin-modal" style="max-width:620px;">
      <div class="admin-modal__cabecera">
        <h2 class="admin-modal__titulo" id="modalDetalleTitulo">Detalle del pedido</h2>
        <button class="admin-modal__cerrar" id="modalDetalleCerrar">&times;</button>
      </div>
      <div id="modalDetalleContenido">Cargando...</div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/pedidos-admin.js"></script>
  <script src="../../js/idioma.js"></script>
</body>
</html>
