<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportes - Panel Administrativo VitalFarma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/reportes.css">
</head>
<body class="admin-body">

  <!-- admin.js inserta aquí el menú lateral -->
  <div class="admin-layout">

    <div>
      <header class="admin-topbar">
        <h1 class="admin-topbar__titulo">Reportes</h1>
        <div class="admin-topbar__usuario">
          <div>
            <div id="adminNombre" style="font-weight:600;">Cargando...</div>
            <span class="admin-topbar__rol" id="adminRol"></span>
          </div>
          <div class="admin-topbar__avatar" id="adminAvatar">A</div>
        </div>
      </header>

      <main class="admin-contenido">
        <div class="rep-layout">

          <!-- CONFIGURACIÓN -->
          <div class="admin-panel">
            <div class="admin-panel__cabecera">
              <h2 class="admin-panel__titulo">Configuración</h2>
            </div>

            <div class="rep-config">

              <div class="rep-campo">
                <label>Periodo rápido</label>
                <div class="rep-atajos">
                  <button class="rep-atajo rep-atajo--activo" data-meses="0">Este mes</button>
                  <button class="rep-atajo" data-meses="1">Mes pasado</button>
                  <button class="rep-atajo" data-meses="3">Últimos 3 meses</button>
                  <button class="rep-atajo" data-meses="12">Último año</button>
                </div>
              </div>

              <div class="rep-campo">
                <label for="repDesde">Desde</label>
                <input type="date" id="repDesde">
              </div>

              <div class="rep-campo">
                <label for="repHasta">Hasta</label>
                <input type="date" id="repHasta">
              </div>

              <div class="rep-campo">
                <label>Secciones a incluir</label>
                <div class="rep-secciones">
                  <label class="rep-check"><input type="checkbox" id="secResumen" checked> <span>Resumen ejecutivo</span></label>
                  <label class="rep-check"><input type="checkbox" id="secVentas" checked> <span>Ventas por día</span></label>
                  <label class="rep-check"><input type="checkbox" id="secEstados" checked> <span>Pedidos por estado</span></label>
                  <label class="rep-check"><input type="checkbox" id="secProductos" checked> <span>Productos más vendidos</span></label>
                  <label class="rep-check"><input type="checkbox" id="secPedidos" checked> <span>Detalle de pedidos</span></label>
                  <label class="rep-check"><input type="checkbox" id="secAtencion" checked> <span>Atención al cliente</span></label>
                </div>
              </div>

              <button class="dash-btn dash-btn--claro" id="repActualizar" style="justify-content:center;">
                <i class="bi bi-arrow-clockwise"></i> Actualizar vista previa
              </button>

              <button class="rep-btn-generar" id="repGenerar">
                <i class="bi bi-file-earmark-pdf"></i> Descargar PDF
              </button>

              <button class="dash-btn dash-btn--claro" id="repCsv" style="justify-content:center;">
                <i class="bi bi-filetype-csv"></i> Exportar pedidos a CSV
              </button>

            </div>
          </div>

          <!-- VISTA PREVIA -->
          <div class="admin-panel">
            <div class="admin-panel__cabecera">
              <h2 class="admin-panel__titulo">Vista previa</h2>
              <span style="font-size:0.78rem; color:var(--color-texto-suave);">Así se verá el contenido del PDF</span>
            </div>
            <div id="repPrevia">
              <div class="dash-cargando"><span class="dash-spinner"></span> Cargando datos...</div>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- jsPDF y AutoTable. Si vas a sustentar sin internet,
       descarga ambos y cámbialos por rutas locales. -->
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>

  <script src="../../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/reportes-admin.js"></script>
</body>
</html>
