<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes médicas - Panel Administrativo VitalFarma</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <div class="admin-layout">
    

    <div>
      <header class="admin-topbar">
        <h1 class="admin-topbar__titulo">Órdenes médicas cargadas</h1>
        <div class="admin-topbar__usuario">
          <div><div id="adminNombre" style="font-weight:600;">Cargando...</div><span class="admin-topbar__rol" id="adminRol"></span></div>
          <div class="admin-topbar__avatar" id="adminAvatar">A</div>
        </div>
      </header>

      <main class="admin-contenido">

        <div class="admin-stats-grid" id="ordenesResumen"></div>

        <!-- Aviso de manejo de datos sensibles -->
        <div style="background:#FEF3C7; border-left:4px solid #F59E0B; padding:12px 16px; border-radius:var(--radio-md); margin-bottom:var(--espacio-lg); font-size:0.82rem;">
          🔒 <strong>Información sensible.</strong> Las órdenes médicas contienen datos de salud.
          Consúltalas únicamente cuando sea necesario para atender un pedido.
        </div>

        <div class="admin-panel">
          <div class="admin-toolbar">
            <select id="filtroEstado" style="padding:10px 14px; border:1.5px solid var(--color-borde); border-radius:var(--radio-md); font-size:0.87rem;">
              <option value="">Todos los estados</option>
              <option value="pendiente">Pendiente</option>
              <option value="procesada">Procesada</option>
              <option value="revisada_por_usuario">Revisada por el cliente</option>
              <option value="error">Con error</option>
            </select>
            <input type="date" id="filtroDesde" title="Desde" style="padding:10px; border:1.5px solid var(--color-borde); border-radius:var(--radio-md); font-size:0.85rem;">
            <input type="date" id="filtroHasta" title="Hasta" style="padding:10px; border:1.5px solid var(--color-borde); border-radius:var(--radio-md); font-size:0.85rem;">
            <button class="btn btn-secundario" id="btnLimpiarFiltros" style="padding:10px 18px;">Limpiar</button>
          </div>

          <div class="admin-tabla-wrapper">
            <table class="admin-tabla">
              <thead>
                <tr>
                  <th>N.º</th>
                  <th>Cliente</th>
                  <th>Fecha de carga</th>
                  <th>Detectados</th>
                  <th>Confirmados</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="ordenesTabla">
                <tr><td colspan="7" style="text-align:center; padding:var(--espacio-lg);">Cargando órdenes...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

      </main>
    </div>
  </div>

  <div class="admin-modal-fondo" id="modalOrdenFondo">
    <div class="admin-modal" style="max-width:600px;">
      <div class="admin-modal__cabecera">
        <h2 class="admin-modal__titulo" id="modalOrdenTitulo">Detalle de la orden</h2>
        <button class="admin-modal__cerrar" id="modalOrdenCerrar">&times;</button>
      </div>
      <div id="modalOrdenContenido">Cargando...</div>
    </div>
  </div>

  <script src="../../js/api.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/ordenes-admin.js"></script>
  <script src="../../js/idioma.js"></script>
</body>
</html>
